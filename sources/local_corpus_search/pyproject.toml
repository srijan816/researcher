[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["local_corpus_search"]
package-dir = {"local_corpus_search" = "src"}

[project]
name = "local-corpus-search"
version = "1.0.0"
description = "NAT local search tool over the persisted scrape-artifact corpus"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    # zvec provides the HNSW ANN index for fast, low-memory dense retrieval.
    # Optional at runtime: search falls back to the SQLite numpy/BM25 path when
    # it is unavailable (e.g. a platform without a prebuilt wheel).
    "zvec>=0.5.0",
]

[project.entry-points."nat.plugins"]
local_corpus_search = "local_corpus_search.register"
